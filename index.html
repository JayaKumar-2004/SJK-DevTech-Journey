<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack | Time-Based Environment Intro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --tree-color: #0d1a00;
            --ground-color: #1a3300;
            --hill-color: #142900;
            --road-color: #2a2a2a;
            --animal-color: #050a00; 
        }

        body, html { 
            width: 100%; 
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
            background-color: #000; 
        }

        /* FIXED: Removed the buggy background transition that caused Chrome banding */
        #environment {
            position: relative; 
            width: 100vw; 
            height: 100vh;
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            z-index: 1; 
            overflow: hidden;
            background-size: cover;
            background-repeat: no-repeat;
            animation: envFadeIn 1.5s ease-in-out forwards;
        }

        @keyframes envFadeIn { from { opacity: 0; } to { opacity: 1; } }

        #greeting-text {
            font-size: clamp(1.8rem, 5vw, 3.8rem); 
            color: #ffffff; 
            text-align: center; 
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            z-index: 30; 
            opacity: 0; 
            animation: fadeInText 3s ease-in-out forwards; 
            animation-delay: 0.8s;
            margin-bottom: 20vh;
        }
        @keyframes fadeInText { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        /* Celestial Bodies */
        .celestial-body { position: absolute; border-radius: 50%; z-index: 2; left: 50%; transform: translateX(-50%); }
        .sun { width: 110px; height: 110px; background: radial-gradient(circle, #ffd700, #ff8c00); box-shadow: 0 0 50px #ff8c00; }
        .moon { width: 90px; height: 90px; background: radial-gradient(circle, #f4f6f0, #c8c8c8); box-shadow: 0 0 30px #ffffff, inset -12px -12px 0 rgba(0,0,0,0.2); }

        /* Stars */
        #stars-container { position: absolute; top: 0; left: 0; width: 100%; height: 65%; z-index: 1; opacity: 0; transition: opacity 2s ease-in-out; }
        .star { position: absolute; background: white; border-radius: 50%; box-shadow: 0 0 4px white; animation: twinkle 3s infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        /* --- BIRDS --- */
        #birds-container { position: absolute; top: 8%; left: 0; width: 100%; height: 30vh; z-index: 3; pointer-events: none; }
        .bird-wrapper { position: absolute; width: 26px; height: 12px; left: -20vw; animation: flyAcross var(--speed) linear infinite var(--delay); }
        .bird { position: relative; width: 100%; height: 100%; animation: swoop var(--swoop-speed) ease-in-out infinite alternate; }
        .bird::before, .bird::after { content: ''; position: absolute; top: 4px; width: 14px; height: 3px; background: var(--animal-color); border-radius: 3px; transition: background 2s; }
        .bird::before { left: 0; transform-origin: right center; animation: flapRight var(--flap-speed) infinite alternate ease-in-out; }
        .bird::after { right: 0; transform-origin: left center; animation: flapLeft var(--flap-speed) infinite alternate ease-in-out; }
        
        @keyframes flapRight { 0% { transform: rotate(20deg); } 100% { transform: rotate(-30deg); } }
        @keyframes flapLeft { 0% { transform: rotate(-20deg); } 100% { transform: rotate(30deg); } }
        @keyframes flyAcross { from { transform: translateX(0) scale(var(--scale)); } to { transform: translateX(140vw) scale(var(--scale)); } }
        @keyframes swoop { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(18px); } }

        .bird-1 { top: 10%; --scale: 1; --speed: 24s; --delay: 0s; --swoop-speed: 3s; --flap-speed: 0.35s; }
        .bird-2 { top: 30%; --scale: 0.8; --speed: 32s; --delay: 4s; --swoop-speed: 4s; --flap-speed: 0.3s; }
        .bird-3 { top: 20%; --scale: 1.1; --speed: 20s; --delay: 2s; --swoop-speed: 2.5s; --flap-speed: 0.4s; }

        /* Clouds */
        .clouds { position: absolute; top: 10%; width: 100%; height: 180px; z-index: 4; opacity: 0.7; }
        .cloud { position: absolute; background: #fff; border-radius: 50px; animation: floatCloud linear infinite; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
        .cloud-1 { width: 130px; height: 45px; top: 8vh; left: -180px; animation-duration: 35s; } .cloud-1::before { width: 60px; height: 60px; top: -28px; left: 18px; } .cloud-1::after { width: 50px; height: 50px; top: -20px; left: 60px; }
        .cloud-2 { width: 95px; height: 32px; top: 22vh; left: -100px; animation-duration: 42s; animation-delay: 8s; transform: scale(0.8); opacity: 0.5; } .cloud-2::before { width: 45px; height: 45px; top: -22px; left: 10px; } .cloud-2::after { width: 35px; height: 35px; top: -14px; left: 40px; }
        @keyframes floatCloud { from { transform: translateX(-200px); } to { transform: translateX(120vw); } }

        /* --- BULLETPROOF LANDSCAPE --- */
        .landscape { position: absolute; bottom: 0; left: 0; width: 100%; height: 260px; z-index: 10; }
        
        .skyline { 
            position: absolute; 
            bottom: 125px; 
            left: 0; 
            width: 100%; 
            height: 90px; 
            background: repeating-linear-gradient(90deg, transparent, transparent 15px, #0b162c 15px, #0b162c 35px, transparent 35px, transparent 45px, #111c33 45px, #111c33 80px); 
            background-repeat: repeat-x;
            background-size: 100% 100%;
            opacity: 0.4; 
            z-index: 8; 
            transition: opacity 2s; 
        }
        
        /* Hills */
        .hill { position: absolute; bottom: 110px; background: var(--hill-color); border-radius: 50% 50% 0 0; transition: background 2s; z-index: 9; }
        .hill-1 { width: 60vw; height: 90px; left: -10vw; z-index: 11; } .hill-2 { width: 70vw; height: 115px; right: -15vw; z-index: 10; }
        
        /* Ground */
        .ground { position: absolute; bottom: 65px; left: 0; width: 100%; height: 55px; background: var(--ground-color); border-top: 2px solid #264d00; z-index: 11; transition: background 2s, border-color 2s; }

        /* Houses */
        .house { position: absolute; background: #2c3e50; z-index: 11; transition: background 2s; }
        .house-roof { position: absolute; width: 0; height: 0; border-left-color: transparent; border-right-color: transparent; border-style: solid; transition: border-bottom-color 2s; }
        .house-window { position: absolute; background: #7f8c8d; border-radius: 2px; transition: all 1s; }
        
        .h1 { bottom: 135px; right: 15vw; width: 50px; height: 35px; } .h1 .house-roof { top: -22px; left: -6px; border-width: 0 31px 22px 31px; border-bottom-color: #1a252f; } .h1 .window-1 { top: 10px; left: 8px; width: 10px; height: 12px; } .h1 .window-2 { top: 10px; right: 8px; width: 10px; height: 12px; }
        .h2 { bottom: 125px; left: 18vw; width: 38px; height: 28px; } .h2 .house-roof { top: -18px; left: -4px; border-width: 0 23px 18px 23px; border-bottom-color: #1a252f; } .h2 .window-1 { top: 7px; left: 13px; width: 10px; height: 10px; }

        .cat { position: absolute; top: -22px; left: 12px; width: 6px; height: 9px; z-index: 12; }
        .cat-body { width: 6px; height: 7px; border-radius: 3px 3px 1px 1px; bottom: 0; position: absolute; background: var(--animal-color); transition: background 2s;}
        .cat-head { width: 7px; height: 5px; border-radius: 50%; top: -3px; left: -0.5px; position: absolute; background: var(--animal-color); transition: background 2s;}

        /* Animals */
        .animal-part { position: absolute; background: var(--animal-color); transition: background 2s; }
        .standing-cow { position: absolute; bottom: 118px; left: 10vw; width: 28px; height: 18px; z-index: 12; }
        .cow-body { width: 24px; height: 12px; border-radius: 5px; top: 3px; }
        .cow-head { width: 9px; height: 7px; border-radius: 2px; top: 0; right: -3px; }
        .cow-leg { width: 2.5px; height: 7px; top: 12px; border-radius: 1px; }
        .cow-l1 { left: 3px; } .cow-l2 { left: 8px; } .cow-l3 { right: 3px; } .cow-l4 { right: 8px; }

        .standing-horse { position: absolute; bottom: 124px; right: 22vw; width: 32px; height: 26px; z-index: 12; transform: scaleX(-1); }
        .horse-body { width: 25px; height: 12px; border-radius: 6px; top: 7px; }
        .horse-neck { width: 7px; height: 12px; top: 0; right: -2px; transform: rotate(30deg); }
        .horse-head { width: 10px; height: 5px; top: -3px; right: -7px; border-radius: 2px; }
        .horse-leg { width: 2.5px; height: 10px; top: 16px; }
        .horse-l1 { left: 3px; } .horse-l2 { left: 8px; } .horse-l3 { right: 3px; } .horse-l4 { right: 8px; }

        /* --- TRAIN TRACKS & TRAINS --- */
        .track { position: absolute; left: 0; width: 100%; height: 6px; border-top: 1.5px solid #57606f; border-bottom: 1.5px solid #57606f; background: repeating-linear-gradient(90deg, transparent, transparent 12px, rgba(17,17,17,0.8) 12px, rgba(17,17,17,0.8) 16px); }
        .track-1 { bottom: 102px; z-index: 13; } 
        .track-2 { bottom: 74px; z-index: 15; }

        .train { position: absolute; width: 480px; height: 32px; display: flex; gap: 4px; flex-direction: row; }
        
        .train-carriage { 
            width: 75px; 
            height: 100%; 
            border-radius: 4px 4px 0 0; 
            position: relative; 
            border-bottom: 2px dashed #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #ffffff; 
            font-weight: 800; 
            font-size: 10.5px; 
            letter-spacing: 0.5px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
        }
        .train-carriage::after { content: ''; position: absolute; top: 3px; left: 6px; width: 63px; height: 4px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3) 10px, transparent 10px, transparent 18px); }
        
        .headlight { position: absolute; opacity: 0; transition: opacity 0.5s; }
        .headlight::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%); opacity: 0; transition: opacity 0.5s; pointer-events: none; }
        
        /* Engine Face Right (LTR Train) */
        .engine-right { width: 60px; height: 100%; background: #4a5568; border-radius: 4px 7px 0 0; position: relative; }
        .engine-right::before { content: ''; position: absolute; top: 4px; right: 6px; width: 14px; height: 10px; background: #a4b0be; border-radius: 2px; }
        .train-headlight-right { right: -2px; bottom: 6px; width: 3px; height: 10px; background: #fff; border-radius: 3px; }
        .train-headlight-right::after { left: 0; width: 100px; height: 32px; background: radial-gradient(ellipse at left, rgba(255,255,255,0.85) 0%, transparent 70%); }

        /* Engine Face Left (RTL Train) */
        .engine-left { width: 60px; height: 100%; background: #4a5568; border-radius: 7px 4px 0 0; position: relative; }
        .engine-left::before { content: ''; position: absolute; top: 4px; left: 6px; width: 14px; height: 10px; background: #a4b0be; border-radius: 2px; }
        .train-headlight-left { left: -2px; bottom: 6px; width: 3px; height: 10px; background: #fff; border-radius: 3px; }
        .train-headlight-left::after { right: 0; width: 100px; height: 32px; background: radial-gradient(ellipse at right, rgba(255,255,255,0.85) 0%, transparent 70%); }

        .train-ltr { bottom: 105px; left: -100vw; z-index: 14; animation: driveLTR 18s linear infinite; }
        .train-ltr .train-carriage { background: #1e3a8a; } 
        
        .train-rtl { bottom: 77px; left: 100vw; z-index: 16; animation: driveRTL 22s linear infinite; }
        .train-rtl .train-carriage { background: #b91c1c; } 

        @keyframes driveLTR { 0% { transform: translateX(0); } 100% { transform: translateX(200vw); } }
        @keyframes driveRTL { 0% { transform: translateX(0); } 100% { transform: translateX(-200vw); } }

        /* --- ROAD & VEHICLES --- */
        .road { position: absolute; bottom: 0; left: 0; width: 100%; height: 65px; background: var(--road-color); border-top: 3px solid #111; z-index: 17; transition: background 2s; }
        .road-lines { position: absolute; top: 50%; width: 100%; height: 2px; background: repeating-linear-gradient(90deg, transparent, transparent 25px, rgba(255, 255, 255, 0.5) 25px, rgba(255, 255, 255, 0.5) 50px); transform: translateY(-50%); }
        .wheel { position: absolute; bottom: 0; background: #2f3542; border-radius: 50%; border: 2px solid #111; }
        
        .vehicle-headlight-right { right: -2px; bottom: 8px; width: 3px; height: 6px; background: #fff; border-radius: 3px; }
        .vehicle-headlight-right::after { left: 0; width: 70px; height: 24px; background: radial-gradient(ellipse at left, rgba(255,255,200,0.85) 0%, transparent 70%); }

        .vehicle-headlight-left { left: -2px; bottom: 8px; width: 3px; height: 6px; background: #fff; border-radius: 3px; }
        .vehicle-headlight-left::after { right: 0; width: 70px; height: 24px; background: radial-gradient(ellipse at right, rgba(255,255,200,0.85) 0%, transparent 70%); }

        .van { position: absolute; bottom: 33px; left: 100vw; width: 75px; height: 28px; z-index: 18; animation: driveRoadRTL 14s linear infinite 2s; }
        .van-body { position: absolute; bottom: 6px; width: 100%; height: 22px; background: #2ed573; border-radius: 6px 3px 3px 3px; }
        .van-window { position: absolute; top: 3px; left: 3px; width: 16px; height: 10px; background: #a4b0be; border-radius: 3px 0 0 0; }
        .van .wheel { width: 14px; height: 14px; } .van .wheel-1 { left: 8px; } .van .wheel-2 { right: 8px; }

        .truck { position: absolute; bottom: 6px; left: -100vw; width: 130px; height: 40px; z-index: 19; animation: driveRoadLTR 15s linear infinite; }
        .truck .cabin { position: absolute; right: 0; bottom: 6px; width: 32px; height: 28px; background: #ff4757; border-radius: 6px 6px 3px 0; } .truck .cabin-window { position: absolute; top: 4px; right: 4px; width: 12px; height: 12px; background: #a4b0be; border-radius: 2px; }
        .truck .trailer { position: absolute; left: 0; bottom: 6px; width: 72px; height: 32px; background: #ced6e0; border-radius: 3px; border: 1.5px solid #747d8c; }
        .truck .wheel { width: 16px; height: 16px; } .truck .wheel-1 { left: 8px; } .truck .wheel-2 { left: 40px; } .truck .wheel-3 { right: 5px; } 

        .car-blue { position: absolute; bottom: 6px; left: -100vw; width: 62px; height: 22px; z-index: 19; animation: driveRoadLTR 10s linear infinite 5s; }
        .car-blue .car-body { position: absolute; bottom: 5px; width: 100%; height: 13px; background: #1e90ff; border-radius: 3px 10px 3px 3px; } .car-blue .car-top { position: absolute; bottom: 17px; left: 10px; width: 32px; height: 9px; background: #1e90ff; border-radius: 6px 6px 0 0; } .car-blue .car-top::after { content: ''; position: absolute; top: 2px; left: 4px; width: 24px; height: 6px; background: #a4b0be; }
        .car-blue .wheel { width: 13px; height: 13px; } .car-blue .wheel-1 { left: 6px; } .car-blue .wheel-2 { right: 10px; }

        @keyframes driveRoadLTR { 0% { transform: translateX(0); } 100% { transform: translateX(200vw); } }
        @keyframes driveRoadRTL { 0% { transform: translateX(0); } 100% { transform: translateX(-200vw); } }

        /* --- STREET LIGHTS (Z: 12) --- */
        .street-light { position: absolute; bottom: 60px; width: 5px; height: 105px; background: #1a1a1a; z-index: 12; }
        .street-light::before { content: ''; position: absolute; top: 0; left: -12px; width: 28px; height: 5px; background: #111; border-radius: 4px; }
        .light-bulb { position: absolute; top: 5px; left: -8px; width: 20px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; transition: all 1s ease; }
        .light-1 { left: 12%; } .light-2 { left: 45%; } .light-3 { right: 12%; }

        /* --- THEME STATES --- */
        .lights-on .light-bulb { background: #ffdb4d; box-shadow: 0 8px 25px 8px rgba(255, 219, 77, 0.6); }
        .lights-on .headlight { opacity: 1; }
        .lights-on .headlight::after { opacity: 1; }
        .lights-on .house-window { background: #ffdb4d; box-shadow: 0 0 10px 2px rgba(255, 219, 77, 0.4); }
        .lights-on .house { background: #111820; } .lights-on .house-roof { border-bottom-color: #0b1015; }
        .lights-on .clouds { opacity: 0.15; } .lights-on #stars-container { opacity: 1; } .lights-on .skyline { opacity: 0.2; }

        .theme-morning { --tree-color: #1a3300; --ground-color: #336600; --hill-color: #264d00; --animal-color: #112200; background: linear-gradient(to top, #ff9a44, #fc6076); }
        .theme-morning .sun { animation: rise 4s ease-out forwards; } .theme-morning .skyline { opacity: 0.4; } 

        .theme-afternoon { --tree-color: #264d00; --ground-color: #408000; --hill-color: #336600; --animal-color: #1a3300; background: linear-gradient(to top, #56ccf2, #2f80ed); }
        .theme-afternoon .sun { top: 15vh; } .theme-afternoon .skyline { opacity: 0.3; } 

        .theme-evening-rain { --tree-color: #050a00; --ground-color: #0a1400; --hill-color: #081200; --road-color: #1a1a1a; --animal-color: #000; background: linear-gradient(to top, #373b44, #4286f4); }
        .theme-evening-rain .sun { animation: setSun 4s ease-out forwards; } .theme-evening-rain .clouds { opacity: 0.9; filter: brightness(0.5); }
        .rain-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.4) 70%, transparent); background-size: 4px 100px; animation: pour 0.6s linear infinite; z-index: 25; display: none; pointer-events: none; }
        .theme-evening-rain .rain-overlay { display: block; } .theme-evening-rain #stars-container { display: none; }

        .theme-evening-moon { --tree-color: #050a00; --ground-color: #0a1400; --hill-color: #081200; --road-color: #1a1a1a; --animal-color: #000; background: linear-gradient(to top, #141e30, #243b55); }
        .theme-evening-moon .moon { animation: rise 4s ease-out forwards; }

        .theme-night { --tree-color: #050a00; --ground-color: #0a1400; --hill-color: #081200; --road-color: #1a1a1a; --animal-color: #000; background: linear-gradient(to top, #0f2027, #203a43, #2c5364); }
        .theme-night .moon { top: 15vh; }

        @keyframes rise { 0% { top: 100vh; opacity: 0; } 100% { top: 15vh; opacity: 1; } }
        @keyframes setSun { 0% { top: 15vh; opacity: 1; } 100% { top: 90vh; opacity: 0.1; } }
        @keyframes pour { 0% { background-position: 0 0; } 100% { background-position: 10px 100vh; } }
    </style>
</head>
<body>

    <div id="environment">
        <div id="stars-container"></div>
        <div id="celestial" class="celestial-body"></div>
        
        <div id="birds-container">
            <div class="bird-wrapper bird-1"><div class="bird"></div></div>
            <div class="bird-wrapper bird-2"><div class="bird"></div></div>
            <div class="bird-wrapper bird-3"><div class="bird"></div></div>
        </div>

        <div class="clouds">
            <div class="cloud cloud-1"></div><div class="cloud cloud-2"></div>
        </div>

        <div class="rain-overlay"></div>
        <h1 id="greeting-text"></h1>

        <div class="landscape" id="landscape">
            <div class="skyline"></div>
            <div class="hill hill-1"></div><div class="hill hill-2"></div>
            <div class="ground"></div>

            <div class="house h1">
                <div class="house-roof"></div>
                <div class="house-window window-1"></div><div class="house-window window-2"></div>
            </div>
            
            <div class="house h2">
                <div class="house-roof"></div>
                <div class="house-window window-1"></div>
                <div class="cat"><div class="animal-part cat-body"></div><div class="animal-part cat-head"></div></div>
            </div>

            <div class="standing-cow">
                <div class="animal-part cow-body"></div><div class="animal-part cow-head"></div>
                <div class="animal-part cow-leg cow-l1"></div><div class="animal-part cow-leg cow-l2"></div><div class="animal-part cow-leg cow-l3"></div><div class="animal-part cow-leg cow-l4"></div>
            </div>

            <div class="standing-horse">
                <div class="animal-part horse-body"></div><div class="animal-part horse-neck"></div><div class="animal-part horse-head"></div>
                <div class="animal-part horse-leg horse-l1"></div><div class="animal-part horse-leg horse-l2"></div><div class="animal-part horse-leg horse-l3"></div><div class="animal-part horse-leg horse-l4"></div>
            </div>

            <!-- STREET LIGHTS BEHIND TRAINS -->
            <div class="street-light light-1"><div class="light-bulb"></div></div>
            <div class="street-light light-2"><div class="light-bulb"></div></div>
            <div class="street-light light-3"><div class="light-bulb"></div></div>

            <div class="track track-1"></div>
            
            <!-- BACK TRAIN (Left to Right) -->
            <div class="train train-ltr">
                <div class="train-carriage">HTML</div>
                <div class="train-carriage">CSS</div>
                <div class="train-carriage">JS</div>
                <div class="train-carriage">REACT</div>
                <div class="train-carriage">NODE</div>
                <div class="engine-right"><div class="headlight train-headlight-right"></div></div>
            </div>
            
            <div class="track track-2"></div>
            
            <!-- FRONT TRAIN (Right to Left) -->
            <div class="train train-rtl">
                <div class="engine-left"><div class="headlight train-headlight-left"></div></div>
                <div class="train-carriage">UI/UX</div>
                <div class="train-carriage">GIT</div>
                <div class="train-carriage">SQL</div>
                <div class="train-carriage">API</div>
                <div class="train-carriage">AWS</div>
            </div>

            <div class="road">
                <div class="road-lines"></div>
                
                <div class="van">
                    <div class="van-body"><div class="van-window"></div></div>
                    <div class="wheel wheel-1"></div><div class="wheel wheel-2"></div><div class="headlight vehicle-headlight-left"></div>
                </div>

                <div class="truck">
                    <div class="trailer"></div><div class="cabin"><div class="cabin-window"></div></div>
                    <div class="wheel wheel-1"></div><div class="wheel wheel-2"></div><div class="wheel wheel-3"></div><div class="headlight vehicle-headlight-right"></div>
                </div>
                
                <div class="car-blue">
                    <div class="car-top"></div><div class="car-body"></div>
                    <div class="wheel wheel-1"></div><div class="wheel wheel-2"></div><div class="headlight vehicle-headlight-right"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const environment = document.getElementById("environment");
            const greetingText = document.getElementById("greeting-text");
            const celestial = document.getElementById("celestial");
            const starsContainer = document.getElementById("stars-container");
            const landscape = document.getElementById("landscape");

            for (let i = 0; i < 30; i++) {
                let star = document.createElement("div");
                star.classList.add("star");
                star.style.width = Math.random() * 2 + 1 + "px";
                star.style.height = star.style.width;
                star.style.top = Math.random() * 100 + "%";
                star.style.left = Math.random() * 100 + "%";
                star.style.animationDelay = Math.random() * 2 + "s";
                starsContainer.appendChild(star);
            }

            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const timeNum = hours + (minutes / 60);

            let greeting = "";
            let themeClass = "";
            let celestialType = "";
            let needsLights = false;

            if (timeNum >= 5.0 && timeNum < 12.0) {
                greeting = "Good morning"; themeClass = "theme-morning"; celestialType = "sun";
            } else if (timeNum >= 12.0 && timeNum < 16.0) {
                greeting = "Good afternoon"; themeClass = "theme-afternoon"; celestialType = "sun";
            } else if (timeNum >= 16.0 && timeNum < 18.75) {
                greeting = "Good evening"; themeClass = "theme-evening-rain"; celestialType = "sun"; needsLights = true;
            } else if (timeNum >= 18.75 && timeNum < 23.0) {
                greeting = "Good evening"; themeClass = "theme-evening-moon"; celestialType = "moon"; needsLights = true;
            } else {
                greeting = "Good night"; themeClass = "theme-night"; celestialType = "moon"; needsLights = true;
            }

            environment.classList.add(themeClass);
            celestial.classList.add(celestialType);
            greetingText.innerHTML = `${greeting}<br>SIR/MA'AM`;
            
            if(needsLights) { landscape.classList.add('lights-on'); }
            
            // Redirects to landing page exactly 10 seconds after load
            setTimeout(() => {
                window.location.href = "landing.html";
            }, 10000);
        });
    </script>
</body>
</html>
